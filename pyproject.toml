[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edin"
version = "0.1.0"
description = "Editor de vídeo dinâmico com IA, grátis e local (ffmpeg + whisper + OpenCV), feito para ser dirigido pelo Claude Code"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.0",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "librosa>=0.10",
]

[project.scripts]
edin = "edin.cli:main"

[tool.setuptools]
packages = ["edin"]
